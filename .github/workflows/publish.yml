# publish.yml — iil-reflex PyPI publish via OIDC Trusted Publishing
#
# RELEASE WORKFLOW:
#   git tag v0.6.0
#   git push origin v0.6.0
#   → GitHub Actions builds + publishes (zero tokens needed)
#
# REQUIRED ONE-TIME SETUP (PyPI side — NOT automatic):
#   This workflow only succeeds if a matching Trusted Publisher exists on PyPI.
#   Configure it on the PROJECT (not an account-level "pending publisher", which is
#   only for projects that don't exist on PyPI yet):
#     https://pypi.org/manage/project/iil-reflex/settings/publishing/
#   The four fields must match the OIDC claims this workflow sends EXACTLY:
#     Owner:        achimdehnert
#     Repository:   iil-reflex
#     Workflow:     publish.yml   ← the file NAME, ".yml" not ".yaml", no path
#     Environment:  pypi          ← matches `environment: name: pypi` in the publish job
#   A mismatch in ANY field fails with `invalid-publisher` — tests + build still pass,
#   only the upload fails. The run log prints the exact claims sent; compare field by
#   field. Configured + verified for v0.6.0 (2026-06-14); a `.yaml` typo in the
#   Workflow field had previously blocked it.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Upload target"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  test:
    name: Tests (publish gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hatch
        run: pip install hatch

      - name: Read version from pyproject.toml
        id: meta
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build wheel + sdist
        run: hatch build

      - name: Verify dist contents
        run: ls -la dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.meta.outputs.version }}
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/iil-reflex/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/iil-reflex/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
